<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CronShell Terminal</title>
    
    <style>
        @font-face {
            font-family: 'Vazir';
            src: url('/static/vazir.woff2') format('woff2');
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Courier New', 'Vazir', monospace;
            background: #0c0c0d;
            color: #c0c0c0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            direction: ltr;
            text-align: left;
        }
        
        .titlebar {
            background: #1a1a1b;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #2a2a2b;
            user-select: none;
            font-size: 12px;
            color: #888;
        }
        .titlebar .dots { display: flex; gap: 8px; }
        .titlebar .dots span { width: 12px; height: 12px; border-radius: 50%; }
        .titlebar .dots .red { background: #ff5f57; }
        .titlebar .dots .yellow { background: #febc2e; }
        .titlebar .dots .green { background: #28c840; }
        .titlebar .title { flex: 1; text-align: center; color: #aaa; }
        
        .terminal {
            flex: 1;
            overflow-y: auto;
            padding: 10px 14px;
            font-size: 13px;
            line-height: 1.6;
            background: #0c0c0d;
        }
        .terminal::-webkit-scrollbar { width: 6px; }
        .terminal::-webkit-scrollbar-track { background: #0c0c0d; }
        .terminal::-webkit-scrollbar-thumb { background: #2a2a2b; border-radius: 3px; }
        
        .entry { margin-bottom: 6px; animation: fadeIn 0.15s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .prompt-line { color: #28c840; }
        .prompt-line .user { color: #5b8dee; }
        .prompt-line .host { color: #28c840; }
        .prompt-line .path { color: #5b8dee; }
        .prompt-line .cmd { color: #e0e0e0; }
        
        .output { color: #c0c0c0; white-space: pre-wrap; word-break: break-all; margin: 2px 0; }
        .output.stderr { color: #ff5f57; }
        .output.running { color: #febc2e; }
        .exit-code { color: #666; font-size: 11px; }
        .exit-code.error { color: #ff5f57; }
        
        .input-line {
            display: flex;
            align-items: center;
            padding: 8px 14px;
            background: #1a1a1b;
            border-top: 1px solid #2a2a2b;
            font-size: 13px;
        }
        .input-line .prompt-sign { color: #28c840; margin-right: 8px; }
        .input-line .prompt-sign .user { color: #5b8dee; }
        .input-line .prompt-sign .host { color: #28c840; }
        .input-line .prompt-sign .path { color: #5b8dee; }
        .input-line input {
            flex: 1;
            background: transparent;
            border: none;
            color: #e0e0e0;
            font-family: 'Courier New', 'Vazir', monospace;
            font-size: 13px;
            outline: none;
            caret-color: #5b8dee;
        }
    </style>
</head>
<body>

<div class="titlebar">
    <div class="dots">
        <span class="red"></span>
        <span class="yellow"></span>
        <span class="green"></span>
    </div>
    <div class="title">user@host: ~ — CronShell Terminal</div>
    <div id="status" style="font-size:11px;color:#28c840;">● Connected</div>
</div>

<div class="terminal" id="terminal">
    <div class="entry" style="color:#666;">
        ┌──────────────────────────────────────────┐<br>
        │  CronShell Terminal v1.0                │<br>
        │  Type your commands below...            │<br>
        └──────────────────────────────────────────┘
    </div>
</div>

<div class="input-line">
    <span class="prompt-sign"><span class="user">user</span>@<span class="host">host</span>:<span class="path">~</span>$</span>
    <input type="text" id="command" placeholder="ls -la" autofocus autocomplete="off" spellcheck="false">
</div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
    const terminal = document.getElementById('terminal');
    const statusEl = document.getElementById('status');
    const cmdInput = document.getElementById('command');
    
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token') || '';
    
    if (!token) {
        document.body.innerHTML = '<h1 style="color:#ff5f57;text-align:center;padding:40px;">Access Denied: Missing token<br><code>?token=YOUR_SECRET_TOKEN</code></h1>';
        throw new Error('No token');
    }
    
    const socket = io({
        query: { token: token }
    });
    
    socket.on('connect', () => {
        statusEl.textContent = '● Connected';
        statusEl.style.color = '#28c840';
    });
    
    socket.on('disconnect', () => {
        statusEl.textContent = '● Disconnected';
        statusEl.style.color = '#ff5f57';
    });
    
    socket.on('message', (data) => {
        if (data.type === 'auth') {
            addSystemLine(data.msg);
            return;
        }
        if (data.type === 'running') {
            addEntry(data.cmd, null, 'running');
            return;
        }
        if (data.type === 'result') {
            updateLastEntry(data);
        }
    });
    
    function addEntry(cmd, result, status) {
        const entry = document.createElement('div');
        entry.className = 'entry';
        const promptHTML = '<span class="prompt-sign"><span class="user">user</span>@<span class="host">host</span>:<span class="path">~</span>$</span>';
        
        if (status === 'running') {
            entry.innerHTML = `${promptHTML} <span class="cmd">${escapeHTML(cmd)}</span>
                <div class="output running">Running...</div>`;
        }
        terminal.appendChild(entry);
        scrollToBottom();
    }
    
    function updateLastEntry(data) {
        const entries = terminal.querySelectorAll('.entry');
        if (entries.length === 0) return;
        const lastEntry = entries[entries.length - 1];
        
        let outputHTML = '';
        if (data.stdout) outputHTML += `<div class="output">${escapeHTML(data.stdout)}</div>`;
        if (data.stderr) outputHTML += `<div class="output stderr">${escapeHTML(data.stderr)}</div>`;
        if (!data.stdout && !data.stderr) outputHTML += `<div class="output" style="color:#666;">(no output)</div>`;
        
        const exitClass = data.exit_code !== 0 ? 'error' : '';
        const exitInfo = `<div class="exit-code ${exitClass}">[exit: ${data.exit_code}]</div>`;
        const promptHTML = '<span class="prompt-sign"><span class="user">user</span>@<span class="host">host</span>:<span class="path">~</span>$</span>';
        
        lastEntry.innerHTML = `${promptHTML} <span class="cmd">${escapeHTML(data.cmd)}</span>
            ${outputHTML}${exitInfo}`;
        scrollToBottom();
    }
    
    function addSystemLine(msg) {
        const entry = document.createElement('div');
        entry.className = 'entry';
        entry.innerHTML = `<div class="output" style="color:#666;"># ${msg}</div>`;
        terminal.appendChild(entry);
        scrollToBottom();
    }
    
    function sendCommand() {
        const cmd = cmdInput.value.trim();
        if (!cmd) return;
        socket.emit('command', {command: cmd});
        history.push(cmd);
        historyIndex = -1;
        cmdInput.value = '';
    }
    
    function scrollToBottom() {
        requestAnimationFrame(() => { terminal.scrollTop = terminal.scrollHeight; });
    }
    
    function escapeHTML(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }
    
    cmdInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendCommand(); });
    document.addEventListener('click', () => cmdInput.focus());
    
    const history = [];
    let historyIndex = -1;
    
    cmdInput.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowUp') {
            e.preventDefault();
            if (historyIndex < history.length - 1) {
                historyIndex++;
                cmdInput.value = history[history.length - 1 - historyIndex];
            }
        } else if (e.key === 'ArrowDown') {
            e.preventDefault();
            if (historyIndex > 0) {
                historyIndex--;
                cmdInput.value = history[history.length - 1 - historyIndex];
            } else {
                historyIndex = -1;
                cmdInput.value = '';
            }
        }
    });
</script>
</body>
</html>
